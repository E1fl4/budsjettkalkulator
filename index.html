<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Budsjettkalkulator</title>
    </head>
    <body>
        <main>
            <h2>Inntekter</h2>
            <div class="inntekt-container">
                <div class="inntekt"><p class="inntekt-tekst">Lønn</p><input type="text"></div>
            </div>
            <div class="inntekt-btn-container">
                <button class="inntekt-btn" popovertarget="test-dialog">+</button>
            </div>
            <h2>Utgifter</h2>
            <div class="utgift-container">
            </div>
            <div class="utgift-btn-container">
                <button class="utgift-btn">+</button>
            </div>
            <h2 class="total-tekst">Total: <span class="total">0</span></h2>
        </main>
        <script src="script.js"></script>
    </body>
</html>
